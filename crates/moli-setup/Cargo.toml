[package]
name = "moli-setup"
description = "Portable operator setup for native Moli integrations."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"


[dependencies]
moli-hyundai.workspace = true
moli-core.workspace = true
moli-runtime.workspace = true
moli-netatmo = { workspace = true, features = ["personal-oauth"] }
moli-profile.workspace = true
moli-solarman.workspace = true
moli-ipp.workspace = true
moli-sonos.workspace = true
moli-moonraker.workspace = true
toml_edit = "0.25"
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true

[lints.clippy]
all = "warn"
pedantic = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
