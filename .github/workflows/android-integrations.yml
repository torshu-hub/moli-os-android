name: Android home and integrations

on:
  pull_request:
    branches: [android/engine-diagnostics]
    paths:
      - 'android/**'
      - 'web/**'
      - 'locales/**'
      - 'integrations/**'
      - 'crates/moli-android/**'
      - 'crates/moli-profile/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - '.cargo/audit.toml'
      - 'Cargo.lock'
      - 'scripts/test-android-integrations.sh'
      - '.github/workflows/android-integrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-integrations-${{ github.ref }}
  cancel-in-progress: false # Finish active verification instead of cancelling an already launched build.

jobs:
  changed-inputs:
    runs-on: ubuntu-24.04
    outputs:
      rebuild: ${{ steps.inputs.outputs.rebuild }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: inputs
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Synchronization is compared with the preceding head, not the whole PR:
          # a source-hygiene/docs-only fix must not rebuild already verified APKs.
          if [ "$EVENT_ACTION" != synchronize ]; then
            echo 'rebuild=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$AFTER" -- android crates vendor integrations locales web .cargo Cargo.toml Cargo.lock moli.example.toml LICENSE NOTICE scripts/build-android.sh scripts/verify-android-apk.py scripts/test-android-integrations.sh .github/workflows/android-integrations.yml; then
            echo 'rebuild=false' >> "$GITHUB_OUTPUT"
          else
            status=$?
            [ "$status" = 1 ] || exit "$status"
            echo 'rebuild=true' >> "$GITHUB_OUTPUT"
          fi
  security:
    needs: changed-inputs
    if: needs.changed-inputs.outputs.rebuild == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit
  apk:
    needs: [changed-inputs, security]
    if: needs.changed-inputs.outputs.rebuild == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned native toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android,x86_64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0"
      - name: Build the real embedded dashboard
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Restore native libraries only when all native inputs match
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            android/app/src/main/jniLibs/arm64-v8a/libmoli_android.so
            android/app/src/main/jniLibs/x86_64/libmoli_android.so
          key: moli-jni-v1-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-ndk28.2.13676358-api28-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/**', 'crates/**', 'vendor/**', 'android/app/src/main/assets/*.toml', 'integrations/**', 'locales/**', 'moli.example.toml', 'web/dist/**', 'scripts/build-android.sh') }}
      - name: Test changed Rust onboarding and one-shot transport
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          cargo +1.99.1 test --locked -p moli-android --lib -p moli-ipp -p moli-igd
          cargo +1.99.1 test --locked -p moli-profile one_shot_uses_normal_transport_and_point_conversion
      - name: Build ARM64 JNI
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: sh scripts/build-android.sh arm64-v8a
      - name: Verify dashboard translations and source status
        run: node scripts/i18n-check.mjs && node --test web/src/maison/lib/source-status.test.js
      - name: Build ARM64 integrations and targeted checks
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p ../android-artifacts/install ../android-artifacts/reports
          ./gradlew --no-daemon :app:testDebugUnitTest --tests io.moli.android.DataFreshnessTest --tests io.moli.android.ProfileInputTest --tests io.moli.android.TrialJournalTest --tests io.moli.android.WeatherBudgetTest --tests io.moli.android.TrialEvidenceTest --tests io.moli.android.NetworkEvidenceTest --tests io.moli.android.DiscoveryHttpTest --tests io.moli.android.MerossMatchesTest --tests io.moli.android.BackupArchiveTest :app:assembleDebug :app:lintDebug -PmoliAppSuffix=.preview.automatic.v0130
          cp app/build/outputs/apk/debug/app-debug.apk ../android-artifacts/install/moli-os-android-0.13.0-arm64.apk
          apk=../android-artifacts/install/moli-os-android-0.13.0-arm64.apk
          python3 ../scripts/verify-android-apk.py "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$apk.certificate.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          (cd ../android-artifacts/install && sha256sum moli-os-android-0.13.0-arm64.apk > SHA256SUMS)
          cp app/src/main/assets/synthetic-temperature.toml ../android-artifacts/install/
          cp ../docs/android/INSTALLATION-0.13.0.txt ../android-artifacts/install/INSTALLATION.txt
      - name: Build the emulator JNI library only on a native cache miss
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: sh scripts/build-android.sh x86_64
      - name: Save only public-code native libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            android/app/src/main/jniLibs/arm64-v8a/libmoli_android.so
            android/app/src/main/jniLibs/x86_64/libmoli_android.so
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Enable KVM for the disposable CI emulator
        run: sudo chmod a+rw /dev/kvm
      - name: Verify Android home, navigation and read-only LAN fixtures
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: sh ../scripts/test-android-integrations.sh
      - name: Check public-source hygiene
        run: sh scripts/leak-check.sh
      - name: Retain install bundle with flat versioned names
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moli-os-android-0.13.0-arm64
          path: android-artifacts/install/*
          if-no-files-found: warn
          retention-days: 14
      - name: Retain verification separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moli-os-android-0.13.0-test-reports
          path: |
            android-artifacts/reports/
            android/app/build/reports/lint-results-debug.html
            android/app/build/test-results/testDebugUnitTest/
          retention-days: 14
