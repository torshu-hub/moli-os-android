name: Android profile import
'on':
  pull_request:
    branches:
    - android/engine-diagnostics
  push:
    branches:
    - android/beta-ready
permissions:
  contents: read
concurrency:
  group: android-integrations-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      candidate: ${{ steps.plan.outputs.candidate }}
      rust: ${{ steps.plan.outputs.rust }}
      web: ${{ steps.plan.outputs.web }}
      image: ${{ steps.plan.outputs.image }}
      emulator: ${{ steps.plan.outputs.emulator }}
      update: ${{ steps.plan.outputs.update }}
      classes: ${{ steps.plan.outputs.classes }}
      reused: ${{ steps.plan.outputs.reused }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - id: plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 tools/android-ci/plan.py
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: android-ci-plan-${{ github.workflow }}
        path: android-ci-plan.json
        retention-days: 2
  apk:
    needs: plan
    if: needs.plan.outputs.candidate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: android-ci-plan-${{ github.workflow }}
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.19.0
        cache: npm
        cache-dependency-path: web/package-lock.json
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
        cache: gradle
        cache-dependency-path: android/**/*.gradle*
    - name: Install pinned native toolchains
      run: |-
        rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android,x86_64-linux-android
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0"
    - name: Build embedded dashboard
      working-directory: web
      run: |-
        npm ci --no-audit --no-fund
        npm run build
    - name: Restore arm64-v8a native inputs
      id: jni-arm64-v8a
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: android/app/src/main/jniLibs/arm64-v8a/libmoli_android.so
        key: moli-jni-v2-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-ndk28.2.13676358-api28-arm64-v8a-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/**', 'crates/**', 'vendor/**', 'android/app/src/main/assets/*.toml', 'integrations/**', 'locales/**', 'moli.example.toml', 'web/dist/**', 'scripts/build-android.sh') }}
    - name: Build arm64-v8a JNI once
      if: steps.jni-arm64-v8a.outputs.cache-hit != 'true'
      run: sh scripts/build-android.sh arm64-v8a
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      if: steps.jni-arm64-v8a.outputs.cache-hit != 'true'
      with:
        path: android/app/src/main/jniLibs/arm64-v8a/libmoli_android.so
        key: ${{ steps.jni-arm64-v8a.outputs.cache-primary-key }}
    - name: Restore x86_64 native inputs
      id: jni-x86_64
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: android/app/src/main/jniLibs/x86_64/libmoli_android.so
        key: moli-jni-v2-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-ndk28.2.13676358-api28-x86_64-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/**', 'crates/**', 'vendor/**', 'android/app/src/main/assets/*.toml', 'integrations/**', 'locales/**', 'moli.example.toml', 'web/dist/**', 'scripts/build-android.sh') }}
      if: needs.plan.outputs.emulator == 'true'
    - name: Build x86_64 JNI once
      if: steps.jni-x86_64.outputs.cache-hit != 'true' && needs.plan.outputs.emulator == 'true'
      run: sh scripts/build-android.sh x86_64
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      if: steps.jni-x86_64.outputs.cache-hit != 'true' && needs.plan.outputs.emulator == 'true'
      with:
        path: android/app/src/main/jniLibs/x86_64/libmoli_android.so
        key: ${{ steps.jni-x86_64.outputs.cache-primary-key }}
    - name: Package unsigned candidate and run applicable JVM checks
      env:
        REUSED: ${{ needs.plan.outputs.reused }}
      run: sh tools/android-ci/build_candidate.sh
    - name: Enable disposable emulator
      if: needs.plan.outputs.emulator == 'true'
      run: sudo chmod a+rw /dev/kvm
    - name: Run selected Android preservation and journey checks
      if: needs.plan.outputs.emulator == 'true'
      uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
      env:
        MOLI_TEST_CLASSES: ${{ needs.plan.outputs.classes }}
        MOLI_UPDATE_CHECK: ${{ needs.plan.outputs.update }}
      with:
        api-level: 35
        arch: x86_64
        target: google_apis
        disable-animations: true
        working-directory: android
        script: |-
          if [ "$MOLI_UPDATE_CHECK" = true ]; then sh ../scripts/test-android-beta-update.sh; fi
          if [ -n "$MOLI_TEST_CLASSES" ]; then sh ../scripts/test-android-integrations.sh; fi
    - name: Seal exact APK and validation evidence
      run: python3 tools/android-ci/bundle.py
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: android-beta-candidate
        path: android-candidate/*
        retention-days: 14
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: android-beta-checks
        path: |-
          android-artifacts/reports/
          android/app/build/test-results/testDebugUnitTest/
          android/app/build/reports/lint-results-beta.html
        retention-days: 14
