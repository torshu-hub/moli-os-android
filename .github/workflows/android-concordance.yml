name: Android configuration preservation
on:
  pull_request:
    branches: [android/engine-diagnostics]
    paths:
      - 'android/**'
      - 'crates/moli-android/**'
      - 'crates/moli-os/**'
      - '.github/workflows/android-concordance.yml'
      - 'scripts/test-android-concordance.sh'
permissions:
  contents: read
concurrency:
  group: android-concordance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned emulator build tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target x86_64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Build embedded assets for the test engine
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: jni
        with:
          path: android/app/src/main/jniLibs/x86_64/libmoli_android.so
          key: moli-jni-v2-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-ndk28.2.13676358-api28-x86_64-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/**', 'crates/**', 'vendor/**', 'android/app/src/main/assets/*.toml', 'integrations/**', 'locales/**', 'moli.example.toml', 'web/dist/**', 'scripts/build-android.sh') }}
      - name: Build one emulator JNI library on cache miss
        if: steps.jni.outputs.cache-hit != 'true'
        run: sh scripts/build-android.sh x86_64
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.jni.outputs.cache-hit != 'true'
        with:
          path: android/app/src/main/jniLibs/x86_64/libmoli_android.so
          key: ${{ steps.jni.outputs.cache-primary-key }}
      - name: Test transaction failures and Android API compatibility
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests io.moli.android.ConfigurationTransactionTest --tests io.moli.android.EquipmentMetadataTest :app:lintDebug
      - run: sudo chmod a+rw /dev/kvm
      - name: Upgrade, recover encrypted fixtures and reconcile without device access
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: |
            sh ../scripts/test-android-beta-update.sh
            sh ../scripts/test-android-concordance.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-concordance-checks
          path: |
            android-artifacts/reports/
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: error
