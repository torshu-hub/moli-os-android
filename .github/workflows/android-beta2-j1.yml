name: Android Beta 2 J1
on:
  push:
    branches: [android/beta2-j1]
permissions:
  contents: read
concurrency:
  group: beta2-j1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - name: Install pinned toolchains
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android,x86_64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Build original dashboard
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Native J1 checks
        run: |
          cargo +1.99.1 test --locked -p moli-android
          cargo +1.99.1 test --locked -p moli-os --lib embedded::tests
      - name: Real HTTPS Open-Meteo through the official engine
        id: weather
        continue-on-error: true
        run: cargo +1.99.1 test --locked -p moli-os --lib embedded::internet_test::official_open_meteo_publishes_real_standard_points -- --ignored --exact
      - name: Build ARM64 engine and unsigned Beta 2 candidate
        run: |
          sh scripts/build-android.sh arm64-v8a
          cd android
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintBeta :app:assembleBeta
      - name: Build isolated emulator engine
        run: sh scripts/build-android.sh x86_64
      - name: Enable disposable emulator
        run: sudo chmod a+rw /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: |
            ./gradlew --no-daemon -PmoliAbis=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=io.moli.android.Beta2JourneyTest#nativeLifecycleConfigurationAuthAndOfficialDashboard :app:connectedDebugAndroidTest
            adb shell am force-stop io.moli.android.app.beta2.test
            ./gradlew --no-daemon -PmoliAbis=x86_64 -PmoliFixtureVersionCode=2 :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am instrument -w -e class io.moli.android.Beta2JourneyTest#updateKeepsTheNativeConfigurationAndWrappedKey io.moli.android.app.beta2.test.test/androidx.test.runner.AndroidJUnitRunner | tee beta2-update-result.txt
            grep -q 'OK (1 test)' beta2-update-result.txt
      - name: Seal candidate and source
        run: |
          mkdir -p android-candidate
          cp android/app/build/outputs/apk/beta/app-beta-unsigned.apk android-candidate/moli-os-beta2-j1-arm64-unsigned.apk
          git rev-parse HEAD > android-candidate/source.txt
          sha256sum android-candidate/*.apk > android-candidate/SHA256SUMS
          python3 scripts/check-beta2-apk.py android-candidate/moli-os-beta2-j1-arm64-unsigned.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moli-os-beta2-j1-arm64-candidate
          path: android-candidate/
          retention-days: 14
          if-no-files-found: error
      - name: Pull synthetic UI evidence
        if: always()
        run: adb pull /sdcard/Android/data/io.moli.android.app.beta2.test/files/screenshots android/app/build/reports/screenshots || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: moli-os-beta2-j1-checks
          path: |
            android/app/build/test-results/
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          retention-days: 14
      - name: Require the real Internet observation for J1 acceptance
        if: steps.weather.outcome != 'success'
        run: exit 1
