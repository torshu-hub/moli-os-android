name: Standalone Android APK

on:
  push:
    branches: [android/standalone-apk, android/recovery-lifecycle]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-apk-${{ github.ref }}
  cancel-in-progress: false # Finish active verification instead of cancelling an already launched build.

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned native toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android,x86_64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0"
      - name: Build the real embedded dashboard
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Build ARM64 JNI
        run: sh scripts/build-android.sh arm64-v8a
      - name: Build and inspect the installable ARM64 debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
          python3 ../scripts/verify-android-apk.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk
          mkdir -p ../android-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../android-artifacts/moli-arm64-debug.apk
          sha256sum ../android-artifacts/moli-arm64-debug.apk > ../android-artifacts/SHA256SUMS
      - name: Build a separate emulator JNI library
        run: sh scripts/build-android.sh x86_64
      - name: Enable KVM for the disposable CI emulator
        run: sudo chmod a+rw /dev/kvm
      - name: Test the real native server and WebView in an isolated emulator
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: |
            ./gradlew --no-daemon :app:installDebug :app:installDebugAndroidTest -PmoliAbis=x86_64
            adb shell pm grant io.moli.android.recovery android.permission.POST_NOTIFICATIONS
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -PmoliAbis=x86_64
            sh ../scripts/test-android-lifecycle.sh
      - name: Retain APK and verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moli-android-debug
          path: |
            android-artifacts/
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
