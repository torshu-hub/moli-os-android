name: Sign owner beta

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Reviewed 40-character commit with successful Android CI'
        required: true
        type: string
        default: 'fde277b8340cb9fea7fd40b75053c3a42a467d88'
      previous_source_sha:
        description: 'Previous signed source commit; empty only for the first beta'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: owner-beta-signing
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.repository == 'torshu-hub/moli-os-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      metadata: ${{ steps.metadata.outputs.json }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Require the exact already-validated source commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PREVIOUS_SHA: ${{ inputs.previous_source_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
        shell: bash
        run: |
          python3 -I - <<'PYCODE'
          import json, os, re, urllib.request
          sha=os.environ['SOURCE_SHA']; previous=os.environ['PREVIOUS_SHA']
          if not re.fullmatch('[a-f0-9]{40}',sha) or (previous and not re.fullmatch('[a-f0-9]{40}',previous)):
              raise SystemExit('A full immutable commit SHA is required')
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['REPOSITORY']+'/actions/runs?head_sha='+sha+'&per_page=100',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response: runs=json.load(response)['workflow_runs']
          required={'check','audit','Source hygiene','Android home and integrations'}
          latest={}
          for run in runs:
              if run['head_sha']==sha and str(run['head_repository']['id'])==os.environ['REPOSITORY_ID']:
                  latest.setdefault(run['name'],run)
          if any(name not in latest or latest[name]['status']!='completed' or latest[name]['conclusion']!='success' for name in required):
              raise SystemExit('Source CI is missing or unsuccessful; no signing access')
          print('Validated immutable source:',sha)
          PYCODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the already-pinned toolchains
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android,x86_64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0"
      - name: Build the embedded dashboard
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Restore unchanged native inputs
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            android/app/src/main/jniLibs/arm64-v8a/libmoli_android.so
            android/app/src/main/jniLibs/x86_64/libmoli_android.so
          key: moli-jni-v1-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-ndk28.2.13676358-api28-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/**', 'crates/**', 'vendor/**', 'android/app/src/main/assets/*.toml', 'integrations/**', 'locales/**', 'moli.example.toml', 'web/dist/**', 'scripts/build-android.sh') }}
      - name: Compile native libraries only if missing
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          sh scripts/build-android.sh arm64-v8a
          sh scripts/build-android.sh x86_64
      - name: Require increasing release metadata
        id: metadata
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PREVIOUS_SHA: ${{ inputs.previous_source_sha }}
        run: |
          set -euo pipefail
          if [ -n "$PREVIOUS_SHA" ]; then
            git cat-file -e "$PREVIOUS_SHA^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$PREVIOUS_SHA"
            python3 scripts/check-android-beta.py --delivery --previous-ref "$PREVIOUS_SHA"
          else
            [ "$SOURCE_SHA" = fde277b8340cb9fea7fd40b75053c3a42a467d88 ] || { echo 'Previous signed source is required'; exit 1; }
            python3 scripts/check-android-beta.py
          fi
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          values=dict(line.split('=',1) for line in Path('android/beta.properties').read_text().splitlines() if line and not line.startswith('#'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('json='+json.dumps(values,separators=(',',':'))+'\n')
              output.write('version='+values['versionName']+'\n')
          PYCODE
      - name: Build unsigned beta and disposable emulator inputs without secrets
        working-directory: android
        run: |
          set -euo pipefail
          mkdir -p ../sign-inputs
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleBeta
          cp app/build/outputs/apk/beta/app-beta-unsigned.apk ../sign-inputs/beta-arm64.apk
          python3 ../scripts/verify-android-apk.py ../sign-inputs/beta-arm64.apk
          (cd .. && python3 scripts/check-android-beta.py --apk sign-inputs/beta-arm64.apk)
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest -PmoliAbis=x86_64 -PmoliAppSuffix=.preview.automatic.v0130 -PmoliVersionCode=16 -PmoliVersionName=0.13.0-preview
          cp app/build/outputs/apk/debug/app-debug.apk ../sign-inputs/source.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ../sign-inputs/source-test.apk
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest -PmoliAbis=x86_64 -PmoliAppSuffix=.beta -PmoliUpdateFixture=true -PmoliVersionCode=17 -PmoliVersionName=0.14.0-beta.1-fixture
          cp app/build/outputs/apk/debug/app-debug.apk ../sign-inputs/beta-a.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ../sign-inputs/beta-test.apk
          ./gradlew --no-daemon :app:assembleDebug -PmoliAbis=x86_64 -PmoliAppSuffix=.beta -PmoliUpdateFixture=true -PmoliVersionCode=18 -PmoliVersionName=0.14.0-beta.2-fixture
          cp app/build/outputs/apk/debug/app-debug.apk ../sign-inputs/beta-b.apk
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest -PmoliAbis=x86_64 -PmoliAppSuffix=.preview.receiver
          cp app/build/outputs/apk/debug/app-debug.apk ../sign-inputs/legacy.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ../sign-inputs/legacy-test.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta-build-inputs
          path: sign-inputs/*.apk
          retention-days: 1

  sign:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    environment: android-beta-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # No checkout, build script, dependency installer or repository code in this job.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned SDK before exposing signing credentials
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0"'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: beta-build-inputs
          path: ${{ runner.temp }}/beta-inputs
      - name: Sign only after the owner verified the NordPass recovery copy
        env:
          BETA_SIGNING_BUNDLE: ${{ secrets.BETA_SIGNING_BUNDLE }}
          BETA_METADATA: ${{ needs.build.outputs.metadata }}
          UNSIGNED_APK: ${{ runner.temp }}/beta-inputs/beta-arm64.apk
          SIGNED_OUTPUT: ${{ runner.temp }}/beta-signed
          SIGN_EMULATOR_INPUTS: 'true'
        shell: bash
        run: |
          python3 -I - <<'PYCODE'
          """Trusted signing step, embedded verbatim in the manual workflow. No project imports."""
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile


          def command(args, **kwargs):
              result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, **kwargs)
              if result.returncode:
                  raise ValueError('Signing tool refused the input; no private diagnostic is printed')
              return result.stdout


          def sign():
              raw = os.environ.pop('BETA_SIGNING_BUNDLE', '')
              if not raw or len(raw) > 40000:
                  raise ValueError('ATTENTE COPIE UTILISATEUR: configure the owner-held signing bundle')
              bundle = json.loads(raw)
              if set(bundle) != {'format', 'p12', 'password', 'certificate_sha256', 'nordpass_confirmed'} or bundle['format'] != 1 or bundle['nordpass_confirmed'] is not True:
                  raise ValueError('Owner recovery confirmation is required')
              password, expected = bundle['password'], bundle['certificate_sha256']
              if not isinstance(password, str) or not 24 <= len(password) <= 128 or any(not 33 <= ord(c) <= 126 for c in password) or not re.fullmatch('[a-f0-9]{64}', expected):
                  raise ValueError('Invalid signing credentials or public fingerprint')
              blob = base64.b64decode(bundle['p12'], validate=True)
              if not 1000 <= len(blob) <= 20000:
                  raise ValueError('Invalid signing container')
              if os.environ.get('GITHUB_ACTIONS') == 'true':
                  for value in (password, bundle['p12']):
                      print('::add-mask::' + value.replace('%', '%25'), flush=True)
              sdk = Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0'
              source = Path(os.environ['UNSIGNED_APK']).resolve()
              metadata = json.loads(os.environ['BETA_METADATA'])
              code, version = metadata['versionCode'], metadata['versionName']
              if metadata['applicationId'] != 'io.moli.android.app.beta' or not re.fullmatch('[1-9][0-9]*', str(code)) or not 16 < int(code) <= 2100000000 or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*', version):
                  raise ValueError('Invalid beta metadata')
              badging = command([str(sdk/'aapt'), 'dump', 'badging', str(source)])
              prefix = f"package: name='io.moli.android.app.beta' versionCode='{code}' versionName='{version}'"
              if not badging.startswith(prefix) or 'application-debuggable' in badging or "sdkVersion:'28'" not in badging or "targetSdkVersion:'35'" not in badging or "native-code: 'arm64-v8a'" not in badging:
                  raise ValueError('Beta APK identity, version, ABI or debugging state mismatch')
              permissions = set(re.findall(r"uses-permission: name='([^']+)'", badging))
              allowed = {'android.permission.'+p for p in ('INTERNET','ACCESS_NETWORK_STATE','CHANGE_WIFI_MULTICAST_STATE','FOREGROUND_SERVICE','FOREGROUND_SERVICE_SPECIAL_USE','POST_NOTIFICATIONS')}
              if permissions != allowed:
                  raise ValueError('Unexpected APK permissions')
              verifier = str(sdk/'apksigner')
              if subprocess.run([verifier, 'verify', str(source)], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0:
                  raise ValueError('The build input must be unsigned')
              output = Path(os.environ['SIGNED_OUTPUT']).resolve()
              if output.exists():
                  raise ValueError('Refusing to overwrite an existing output directory')
              output.mkdir(mode=0o700, parents=True)
              release = output/'release'; release.mkdir(mode=0o700)
              apk = release/f'moli-os-{version}-arm64.apk'
              try:
                  with tempfile.TemporaryDirectory(prefix='moli-sign-', dir=os.environ.get('RUNNER_TEMP')) as temporary:
                      keyfile = Path(temporary)/'beta.p12'
                      fd = os.open(keyfile, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
                      with os.fdopen(fd, 'wb') as stream:
                          stream.write(blob)
                      child = dict(os.environ, MOLI_KS_PASSWORD=password)
                      pairs = [(source, apk)]
                      if os.environ.get('SIGN_EMULATOR_INPUTS') == 'true':
                          emulator = output/'emulator'; emulator.mkdir(mode=0o700)
                          packages = {'source.apk':'io.moli.android.app.preview.automatic.v0130',
                                      'source-test.apk':'io.moli.android.app.preview.automatic.v0130.test',
                                      'beta-a.apk':'io.moli.android.app.beta', 'beta-b.apk':'io.moli.android.app.beta',
                                      'beta-test.apk':'io.moli.android.app.beta.test',
                                      'legacy.apk':'io.moli.android.app.preview.receiver',
                                      'legacy-test.apk':'io.moli.android.app.preview.receiver.test'}
                          for name, package in packages.items():
                              candidate = source.parent/name
                              description = command([str(sdk/'aapt'), 'dump', 'badging', str(candidate)])
                              if not description.startswith("package: name='"+package+"'"):
                                  raise ValueError('Unexpected emulator package')
                              pairs.append((candidate, emulator/name))
                      for original, signed in pairs:
                          command([verifier, 'sign', '--ks', str(keyfile), '--ks-type', 'PKCS12', '--ks-key-alias', 'moli-beta',
                                   '--ks-pass', 'env:MOLI_KS_PASSWORD', '--key-pass', 'env:MOLI_KS_PASSWORD',
                                   '--v1-signing-enabled', 'false', '--v2-signing-enabled', 'true', '--v3-signing-enabled', 'false',
                                   '--v4-signing-enabled', 'false', '--out', str(signed), str(original)], env=child)
                          certificate = command([verifier, 'verify', '--verbose', '--print-certs', str(signed)])
                          found = re.findall(r'Signer #\d+ certificate SHA-256 digest: ([a-fA-F0-9]{64})', certificate)
                          if found != [expected]:
                              raise ValueError('APK signer does not match the owner recovery fingerprint')
                          command([str(sdk/'zipalign'), '-c', '-P', '16', '4', str(signed)])
                  digest = hashlib.sha256(apk.read_bytes()).hexdigest()
                  (release/'SHA256SUMS').write_text(digest+'  '+apk.name+'\n')
                  (release/'CERTIFICATE-SHA256.txt').write_text(expected+'\n')
                  (release/'INSTALLATION.txt').write_text('Moli OS Bêta — signature de test réutilisable.\nPremière installation : restaurer si utile avant Recherche/Mes appareils.\nMise à jour : arrêter Moli puis installer par-dessus, sans désinstaller ni effacer les données.\nEn cas de refus de signature : arrêter et signaler le message.\n')
                  print('Signed beta verified; public certificate SHA-256: '+expected)
              except Exception:
                  # Remove only this operation's newly created output; never existing owner data.
                  import shutil
                  shutil.rmtree(output)
                  raise


          if __name__ == '__main__':
              try:
                  sign()
              except Exception:
                  print('Signing stopped: missing owner recovery confirmation, invalid metadata/credentials or SDK verification failure. No key was generated.', file=sys.stderr)
                  sys.exit(1)
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta-signed-verification-inputs
          path: ${{ runner.temp }}/beta-signed/
          retention-days: 1

  verify-and-deliver:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: beta-signed-verification-inputs
          path: signed
      - name: Enable the disposable emulator
        run: sudo chmod a+rw /dev/kvm
      - name: Prepare trusted signed update proof
        shell: bash
        run: |
          cat > verify-beta-signed.sh <<'SIGNED_PROOF'
          #!/bin/sh
          # Only signed disposable emulator fixtures; the real signer and secrets are not in this job.
          set -eu
          [ "$(adb shell getprop ro.kernel.qemu | tr -d '\r')" = 1 ] || { echo 'Disposable emulator required' >&2; exit 1; }
          preview=io.moli.android.app.preview.automatic.v0130
          beta=io.moli.android.app.beta
          legacy=io.moli.android.app.preview.receiver
          for package in "$preview" "$preview.test" "$beta" "$beta.test" "$legacy" "$legacy.test"; do
              if adb shell pm path "$package" | grep -q '^package:'; then echo 'Fresh emulator required; existing data untouched' >&2; exit 1; fi
          done
          mkdir -p proof
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          run_test() {
              adb shell am instrument -w -r -e class "io.moli.android.BetaUpdateTest#$2" "$1.test/androidx.test.runner.AndroidJUnitRunner" > "proof/$3.txt"
              cat "proof/$3.txt"
              grep -Fq 'OK (1 test)' "proof/$3.txt"
          }
          transfer() {
              adb exec-out run-as "$preview" cat "files/$1" > "$scratch/archive"
              adb shell run-as "$2" mkdir -p files
              adb shell -T run-as "$2" tee "files/$1" < "$scratch/archive" > /dev/null
          }
          adb shell settings put system screen_off_timeout 1800000
          adb shell svc power stayon true
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb install signed/emulator/source.apk
          adb install signed/emulator/source-test.apk
          run_test "$preview" exportPreviewWithoutPin preview-export
          run_test "$preview" exportLegacyNumericPinFixture legacy-export
          adb uninstall "$preview.test"
          adb install signed/emulator/beta-a.apk
          adb install signed/emulator/beta-test.apk
          transfer beta-transfer.molibak "$beta"
          run_test "$beta" importIntoFreshBetaA migration-a
          adb install -r signed/emulator/beta-b.apk
          run_test "$beta" verifyBetaBAfterReplacement update-b
          if adb install -r signed/emulator/beta-a.apk > proof/downgrade.txt 2>&1; then exit 1; fi
          grep -Fq INSTALL_FAILED_VERSION_DOWNGRADE proof/downgrade.txt
          run_test "$beta" verifyBetaBAfterReplacement after-refused-downgrade
          adb uninstall "$beta.test"
          adb install signed/emulator/legacy.apk
          adb install signed/emulator/legacy-test.apk
          transfer legacy-transfer.molibak "$legacy"
          run_test "$legacy" restoreLegacyPinInIndependentUid legacy-restore
          # No uninstall of the beta, no clearing, export or restore between A and B.
          # The entire disposable VM is discarded by the emulator runner after the proof.
          printf '%s\n' 'PASS same approved beta certificate, migration, A->B, UID/Keystore/vault/account/data intact; synthetic fixtures only' > proof/summary.txt
          SIGNED_PROOF
      - name: Verify migration and update with the actual beta certificate
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: sh verify-beta-signed.sh
      - name: Deliver only after successful signed update proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moli-os-${{ needs.build.outputs.version }}-arm64
          path: signed/release/
          retention-days: 14
      - name: Retain only public or synthetic proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta-certificate-update-proof
          path: proof/*.txt
          retention-days: 14
