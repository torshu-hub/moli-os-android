# Owner-authorized one-time delivery of the already validated Beta 2 J1 candidate.
name: Sign owner Beta 2 J1
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: owner-beta2-j1-signing
  cancel-in-progress: false
jobs:
  gate:
    if: github.ref == 'refs/heads/main' && github.repository == 'torshu-hub/moli-os-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
      metadata: ${{ steps.gate.outputs.metadata }}
      unsigned_sha256: ${{ steps.gate.outputs.unsigned_sha256 }}
    steps:
    - id: gate
      name: Verify the exact owner-reviewed Beta 2 candidate
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 -I - <<'PYCODE'
        # Trusted fixed-candidate gate. No checkout or project import before key access.
        import hashlib, io, json, os, re, urllib.error, urllib.request, zipfile
        from pathlib import Path
        REPO = 'torshu-hub/moli-os-android'
        SOURCE = '0b188d630eabd3b0bd77c5f56bb64bd06f9800f3'
        CANDIDATE_RUN = 40778846199
        REQUIRED_RUNS = {40778846199: '.github/workflows/android-beta2-j1.yml', 40778855636: '.github/workflows/check.yml', 40778855613: '.github/workflows/audit.yml'}
        UNSIGNED = '8080fc79e378abadcd8bd6fe666f7d7e146fb5f388337fe1c34efc696003449d'
        ARTIFACT = 'moli-os-beta2-j1-arm64-candidate'
        TAG = 'moli-beta2-code-1'
        API = 'https://api.github.com/repos/'+REPO
        TOKEN = os.environ['GH_TOKEN']
        class StripAuthRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl):
                if not newurl.startswith('https://'):
                    raise ValueError('HTTPS redirect required')
                result = super().redirect_request(req, fp, code, msg, headers, newurl)
                result.remove_header('Authorization')
                return result

        def request(path, binary=False, optional=False):
            req=urllib.request.Request(API+path, headers={'Authorization':'Bearer '+TOKEN,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
            try:
                with urllib.request.build_opener(StripAuthRedirect()).open(req,timeout=60) as response:
                    data=response.read(150_000_001)
                    if len(data)>150_000_000: raise ValueError('Response exceeds bound')
                    return data if binary else json.loads(data)
            except urllib.error.HTTPError as error:
                if optional and error.code==404:return None
                raise ValueError('GitHub validation request failed') from None
        if request('/releases/tags/'+TAG, optional=True) is not None:
            with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('approved=false\n')
            print('Release already exists; no new signing attempt')
            raise SystemExit(0)
        if not re.fullmatch('[a-f0-9]{64}',UNSIGNED):raise ValueError('Owner review requires the actual CI APK digest')
        branch=request('/git/ref/heads/android/beta2-j1')
        if branch['object']['sha']!=SOURCE:raise ValueError('Candidate branch moved; review the new source first')
        for number,path in REQUIRED_RUNS.items():
            run=request('/actions/runs/'+str(number))
            if run['repository']['full_name']!=REPO or run['head_sha']!=SOURCE or run['path']!=path or run['status']!='completed' or run['conclusion']!='success':
                raise ValueError('Pinned source checks are incomplete or failed')
        artifacts=request('/actions/runs/'+str(CANDIDATE_RUN)+'/artifacts')['artifacts']
        found=[a for a in artifacts if a['name']==ARTIFACT and not a['expired']]
        if len(found)!=1:raise ValueError('Unique non-expired candidate required')
        archive=zipfile.ZipFile(io.BytesIO(request('/actions/artifacts/'+str(found[0]['id'])+'/zip',binary=True)))
        expected={'moli-os-beta2-j1-arm64-unsigned.apk','source.txt','SHA256SUMS'}
        if set(archive.namelist())!=expected or len(archive.infolist())!=3 or any(e.file_size>100_000_000 for e in archive.infolist()):raise ValueError('Unexpected artifact contents')
        if archive.read('source.txt').decode().strip()!=SOURCE:raise ValueError('Wrong artifact source')
        apk=archive.read('moli-os-beta2-j1-arm64-unsigned.apk')
        if hashlib.sha256(apk).hexdigest()!=UNSIGNED:raise ValueError('Unsigned artifact differs from the reviewed bytes')
        Path('validated-beta2').mkdir(mode=0o700)
        Path('validated-beta2/unsigned.apk').write_bytes(apk)
        metadata={'applicationId':'io.moli.android.app.beta2','versionCode':1,'versionName':'0.1.0-beta2.j1','source_sha':SOURCE}
        with open(os.environ['GITHUB_OUTPUT'],'a') as out:
            out.write('approved=true\nunsigned_sha256='+UNSIGNED+'\nmetadata='+json.dumps(metadata,separators=(',',':'))+'\n')
        PYCODE
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.gate.outputs.approved == 'true'
      with:
        name: validated-beta2
        path: validated-beta2/
        retention-days: 1
        if-no-files-found: error
  sign:
    needs: gate
    if: needs.gate.outputs.approved == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-beta-signing
    steps:
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - name: Prepare SDK before secret access
      run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0"'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: validated-beta2
        path: validated-beta2
    - name: Sign validated bytes with existing owner certificate
      env:
        BETA_SIGNING_BUNDLE: ${{ secrets.BETA_SIGNING_BUNDLE }}
        EXPECTED_CERTIFICATE: ce51eb0755d1e4fd5043d833108f0ed374f44cdac8734e4cf63f2efe1bc3bf37
        UNSIGNED_SHA256: ${{ needs.gate.outputs.unsigned_sha256 }}
        BETA_METADATA: ${{ needs.gate.outputs.metadata }}
        UNSIGNED_APK: validated-beta2/unsigned.apk
        SIGNED_OUTPUT: signed
      run: "python3 -I - <<'PYCODE'\n\"\"\"Trusted signing step, embedded verbatim in the manual workflow. No project imports.\"\
        \"\"\nimport base64\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport subprocess\n\
        import sys\nimport tempfile\n\n\ndef command(args, **kwargs):\n    result = subprocess.run(args, stdout=subprocess.PIPE,\
        \ stderr=subprocess.PIPE, text=True, **kwargs)\n    if result.returncode:\n        raise ValueError('Signing tool\
        \ refused the input; no private diagnostic is printed')\n    return result.stdout\n\n\ndef sign():\n    raw = os.environ.pop('BETA_SIGNING_BUNDLE',\
        \ '')\n    if not raw or len(raw) > 40000:\n        raise ValueError('ATTENTE COPIE UTILISATEUR: configure the owner-held\
        \ signing bundle')\n    bundle = json.loads(raw)\n    if set(bundle) != {'format', 'p12', 'password', 'certificate_sha256',\
        \ 'nordpass_confirmed'} or bundle['format'] != 1 or bundle['nordpass_confirmed'] is not True:\n        raise ValueError('Owner\
        \ recovery confirmation is required')\n    password, expected = bundle['password'], bundle['certificate_sha256']\n\
        \    if expected != os.environ.get('EXPECTED_CERTIFICATE'):\n        raise ValueError('Existing beta certificate pin\
        \ is required')\n    if not isinstance(password, str) or not 24 <= len(password) <= 128 or any(not 33 <= ord(c) <=\
        \ 126 for c in password) or not re.fullmatch('[a-f0-9]{64}', expected):\n        raise ValueError('Invalid signing\
        \ credentials or public fingerprint')\n    blob = base64.b64decode(bundle['p12'], validate=True)\n    if not 1000\
        \ <= len(blob) <= 20000:\n        raise ValueError('Invalid signing container')\n    if os.environ.get('GITHUB_ACTIONS')\
        \ == 'true':\n        for value in (password, bundle['p12']):\n            print('::add-mask::' + value.replace('%',\
        \ '%25'), flush=True)\n    sdk = Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0'\n    source = Path(os.environ['UNSIGNED_APK']).resolve()\n\
        \    if hashlib.sha256(source.read_bytes()).hexdigest()!=os.environ.get('UNSIGNED_SHA256'):\n        raise ValueError('Unsigned\
        \ bytes must match the validated artifact')\n    metadata = json.loads(os.environ['BETA_METADATA'])\n    code, version\
        \ = metadata['versionCode'], metadata['versionName']\n    if metadata['applicationId'] != 'io.moli.android.app.beta2'\
        \ or not re.fullmatch('[1-9][0-9]*', str(code)) or not 0 < int(code) <= 2100000000 or not re.fullmatch(r'[0-9]+\\\
        .[0-9]+\\.[0-9]+-beta2\\.[A-Za-z0-9.]+', version):\n        raise ValueError('Invalid beta metadata')\n    badging\
        \ = command([str(sdk/'aapt'), 'dump', 'badging', str(source)])\n    prefix = f\"package: name='io.moli.android.app.beta2'\
        \ versionCode='{code}' versionName='{version}'\"\n    if not badging.startswith(prefix) or 'application-debuggable'\
        \ in badging or \"sdkVersion:'28'\" not in badging or \"targetSdkVersion:'35'\" not in badging or \"native-code: 'arm64-v8a'\"\
        \ not in badging:\n        raise ValueError('Beta APK identity, version, ABI or debugging state mismatch')\n    permissions\
        \ = set(re.findall(r\"uses-permission: name='([^']+)'\", badging))\n    allowed = {'android.permission.'+p for p in\
        \ ('INTERNET','FOREGROUND_SERVICE','FOREGROUND_SERVICE_SPECIAL_USE','POST_NOTIFICATIONS')}\n    if permissions !=\
        \ allowed:\n        raise ValueError('Unexpected APK permissions')\n    verifier = str(sdk/'apksigner')\n    if subprocess.run([verifier,\
        \ 'verify', str(source)], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0:\n        raise ValueError('The\
        \ build input must be unsigned')\n    output = Path(os.environ['SIGNED_OUTPUT']).resolve()\n    if output.exists():\n\
        \        raise ValueError('Refusing to overwrite an existing output directory')\n    output.mkdir(mode=0o700, parents=True)\n\
        \    release = output/'release'; release.mkdir(mode=0o700)\n    apk = release/f'moli-os-{version}-arm64.apk'\n   \
        \ try:\n        with tempfile.TemporaryDirectory(prefix='moli-sign-', dir=os.environ.get('RUNNER_TEMP')) as temporary:\n\
        \            keyfile = Path(temporary)/'beta.p12'\n            fd = os.open(keyfile, os.O_WRONLY | os.O_CREAT | os.O_EXCL,\
        \ 0o600)\n            with os.fdopen(fd, 'wb') as stream:\n                stream.write(blob)\n            child =\
        \ dict(os.environ, MOLI_KS_PASSWORD=password)\n            pairs = [(source, apk)]\n            for original, signed\
        \ in pairs:\n                command([verifier, 'sign', '--ks', str(keyfile), '--ks-type', 'PKCS12', '--ks-key-alias',\
        \ 'moli-beta',\n                         '--ks-pass', 'env:MOLI_KS_PASSWORD', '--key-pass', 'env:MOLI_KS_PASSWORD',\n\
        \                         '--v1-signing-enabled', 'false', '--v2-signing-enabled', 'true', '--v3-signing-enabled',\
        \ 'false',\n                         '--v4-signing-enabled', 'false', '--out', str(signed), str(original)], env=child)\n\
        \                certificate = command([verifier, 'verify', '--verbose', '--print-certs', str(signed)])\n        \
        \        found = re.findall(r'Signer #\\d+ certificate SHA-256 digest: ([a-fA-F0-9]{64})', certificate)\n        \
        \        if found != [expected]:\n                    raise ValueError('APK signer does not match the owner recovery\
        \ fingerprint')\n                command([str(sdk/'zipalign'), '-c', '-P', '16', '4', str(signed)])\n        digest\
        \ = hashlib.sha256(apk.read_bytes()).hexdigest()\n        (release/'SHA256SUMS').write_text(digest+'  '+apk.name+'\\\
        n')\n        (release/'CERTIFICATE-SHA256.txt').write_text(expected+'\\n')\n        (release/'INSTALLATION.txt').write_text('Moli\
        \ OS Android Beta 2 \u2014 J1.\\nInstaller \xE0 c\xF4t\xE9 de code39, sans import ni d\xE9sinstallation.\\nFutures\
        \ mises \xE0 jour Beta 2 : arr\xEAter le moteur et installer par-dessus, sans effacer les donn\xE9es.\\n')\n     \
        \   print('Signed beta verified; public certificate SHA-256: '+expected)\n    except Exception:\n        # Remove\
        \ only this operation's newly created output; never existing owner data.\n        import shutil\n        shutil.rmtree(output)\n\
        \        raise\n\n\nif __name__ == '__main__':\n    try:\n        sign()\n    except Exception:\n        print('Signing\
        \ stopped: missing owner recovery confirmation, invalid metadata/credentials or SDK verification failure. No key was\
        \ generated.', file=sys.stderr)\n        sys.exit(1)\nPYCODE\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: signed-beta2-j1
        path: signed/release/
        retention-days: 14
        if-no-files-found: error
  publish:
    needs:
    - gate
    - sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - name: Prepare SDK before secret access
      run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0"'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: signed-beta2-j1
        path: release
    - name: Independently verify and publish Beta 2 only
      env:
        GH_TOKEN: ${{ github.token }}
      run: "python3 -I - <<'PYCODE'\nimport hashlib, re, subprocess\nfrom pathlib import Path\nSOURCE='0b188d630eabd3b0bd77c5f56bb64bd06f9800f3'\n\
        CERTIFICATE='ce51eb0755d1e4fd5043d833108f0ed374f44cdac8734e4cf63f2efe1bc3bf37'\nimport os\nsdk=Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0'\n\
        release=Path('release')\napk=release/'moli-os-0.1.0-beta2.j1-arm64.apk'\ncert=subprocess.check_output([str(sdk/'apksigner'),'verify','--verbose','--print-certs',str(apk)],text=True)\n\
        if re.findall(r'Signer #\\d+ certificate SHA-256 digest: ([a-fA-F0-9]{64})',cert)!=[CERTIFICATE]:raise ValueError('Wrong\
        \ signer')\npackage=subprocess.check_output([str(sdk/'aapt'),'dump','badging',str(apk)],text=True)\nif not package.startswith(\"\
        package: name='io.moli.android.app.beta2' versionCode='1' versionName='0.1.0-beta2.j1'\") or 'application-debuggable'\
        \ in package:raise ValueError('Wrong identity or debugging state')\nsubprocess.run([str(sdk/'zipalign'),'-c','-P','16','4',str(apk)],check=True)\n\
        actual=hashlib.sha256(apk.read_bytes()).hexdigest()\nif (release/'SHA256SUMS').read_text()!=actual+'  '+apk.name+'\\\
        n':raise ValueError('Wrong release digest')\n(release/'SOURCE.txt').write_text(SOURCE+'\\n')\nnotes=Path('notes.txt');notes.write_text('Moli\
        \ OS Android Beta 2 J1. Installation neuve \xE0 c\xF4t\xE9 de code39, sans import.\\nSource : '+SOURCE+'\\nSignature\
        \ propri\xE9taire existante, identit\xE9 Beta 2 distincte. Validation physique S5e \xE0 effectuer.\\n')\nsubprocess.run(['gh','release','create','moli-beta2-code-1',*[str(p)\
        \ for p in sorted(release.iterdir())],'--repo','torshu-hub/moli-os-android','--target',SOURCE,'--prerelease','--title','Moli\
        \ OS Android Beta 2 J1 \u2014 0.1.0-beta2.j1','--notes-file',str(notes)],check=True)\nPYCODE\n"
